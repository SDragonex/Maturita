<section class="study-example"{% if title %} aria-label="{{ title }}"{% endif %}>
  <div class="example-header">
    <span class="example-badge"><i class="fa-solid fa-calculator" aria-hidden="true"></i> {{ badge | default(value="ŘEŠENÝ PŘÍKLAD") }}</span>
    {% if title %}<h4 class="example-title">{{ title }}</h4>{% endif %}
  </div>
  <div class="example-body">
    {{ body | markdown | safe }}
  </div>
</section>
