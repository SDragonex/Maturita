<blockquote class="literary-quote">
  <div class="literary-quote-body">
    {{ body | markdown | safe }}
  </div>
  {% if author or work or source or year %}
  <footer class="literary-quote-footer">
    <cite>
      {% if author %}<span class="quote-author">{{ author }}</span>{% endif %}
      {% if work %}<span class="quote-work">{{ work }}</span>{% endif %}
      {% if source %}<span class="quote-source">{{ source }}</span>{% endif %}
      {% if year %}<span class="quote-year">({{ year }})</span>{% endif %}
    </cite>
  </footer>
  {% endif %}
</blockquote>
